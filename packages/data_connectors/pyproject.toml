[project]
name = "datosabiertos-connectors"
version = "0.1.0"
description = "Source connectors for DatosAbiertos AR (CKAN and future source types)"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.14,<3",
  "tenacity>=9.2,<10",
  "structlog>=26.1,<27",
]

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datosabiertos_connectors"]

[tool.hatch.build.targets.wheel.force-include]
"src/datosabiertos_connectors/py.typed" = "datosabiertos_connectors/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
