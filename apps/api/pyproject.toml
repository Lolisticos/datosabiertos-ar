[project]
name = "datosabiertos-api"
version = "0.1.0"
description = "DatosAbiertos AR HTTP API"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.165,<0.166",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "psycopg[binary,pool]>=3.3,<3.4",
  "alembic>=1.20,<1.21",
  "geoalchemy2>=0.21,<0.22",
  "httpx>=0.28,<0.29",
  "structlog>=26.1,<27",
  "tenacity>=9.2,<10",
  "typer>=0.29,<0.30",
  "datosabiertos-connectors",
]

[project.scripts]
datosabiertos = "datosabiertos.cli:app"

[dependency-groups]
dev = [
  "pytest>=9.2,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datosabiertos"]

[tool.hatch.build.targets.wheel.force-include]
"src/datosabiertos/py.typed" = "datosabiertos/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "integration: requires a live PostgreSQL/PostGIS database (DATOSABIERTOS_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:datosabiertos.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["geoalchemy2.*"]
ignore_missing_imports = true

[tool.uv.sources]
datosabiertos-connectors = { workspace = true }
