name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: datosabiertos
          POSTGRES_PASSWORD: datosabiertos
          POSTGRES_DB: datosabiertos_test
        ports:
          - 55437:5432
        options: >-
          --health-cmd "pg_isready -U datosabiertos -d datosabiertos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATOSABIERTOS_TEST_DATABASE_URL: postgresql+psycopg://datosabiertos:datosabiertos@localhost:55437/datosabiertos_test
      DATOSABIERTOS_DATABASE_URL: postgresql+psycopg://datosabiertos:datosabiertos@localhost:55437/datosabiertos_test
      DATOSABIERTOS_STORAGE_ROOT: ./data/storage
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.9"
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Connectors — lint, types, tests
        run: |
          cd packages/data_connectors
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
          uv run pytest -q

      - name: API — lint and types
        run: |
          cd apps/api
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src

      - name: API — migrations up and down
        run: |
          cd apps/api
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: API — tests
        run: |
          cd apps/api
          uv run pytest -q

  web:
    name: Web (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8008
